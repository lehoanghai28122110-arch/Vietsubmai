services:
  - type: web
    name: vietsubminecratf
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      # Mat khau may chu (nhieu mat khau thi ngan cach bang dau |)
      - key: VSMC_KEY
        sync: true
      # Email hien tren trang Lien he / Go noi dung
      - key: VSMC_CONTACT
        sync: true
      # Tuy chon: nghe video nhanh bang Groq, dich bang Claude
      - key: GROQ_API_KEY
        sync: true
      - key: ANTHROPIC_API_KEY
        sync: true
      # Gioi han file tai len (MB)
      - key: VSMC_MAX_UPLOAD_MB
        value: "1024"
      - key: VSMC_MAX_WORK_MB
        value: "3072"
